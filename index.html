<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <link rel="stylesheet" href="styles.css">
  <title>Socials | R34 Skyline</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Nissan Font -->
  <script src="https://c.webfontfree.com/c.js?f=NissanBrandW10-Light" type="text/javascript"></script>
</head>
<body class="bg-zinc-950 flex items-center justify-center min-h-screen">

  <div class="bg-zinc-900 p-6 rounded-2xl shadow-lg flex flex-col items-center w-80">
    
    <!-- Title -->
    <nav class="text-3xl font-bold mb-4">
      <span class="Logo text-sky-400">Nissan</span>
      <span class="text-white">GT-</span>
      <span class="text-red-600">R</span>
    </nav>

    <!-- Profile Image -->
    <img 
      src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQJ8GnUvYNyXuvGkfb5N7vJl-qza7TpBwl7ig&s" 
      class="w-24 h-24 rounded-full mb-4 border-4 border-sky-400" 
      alt="Profile Image"
    />

    <!-- Social Links -->
    <div class="flex gap-4 mt-4">
      <a href="https://discord.gg/YNXyYeXMsm" target="_blank" class="text-sky-400 hover:text-sky-300 text-2xl">
        <!-- Example icon - you can replace these with SVGs or emojis -->
        <i class='bx bxl-discord-alt'></i>
      </a>
      <a href="#" class="text-sky-400 hover:text-sky-300 text-2xl">
        <i class='bx bxl-instagram' ></i>
      </a>
      <a href="https://www.youtube.com/@DevByte.official" 
      target="_blank" class="text-sky-400 hover:text-sky-300 text-2xl">
        <i class='bx bxl-youtube' ></i>
      </a>
      <a href="#" class="text-sky-400 hover:text-sky-300 text-2xl">
        <i class='bx bxl-twitter' ></i>
      </a>
      <a href="https://github.com/R34SKYLINEGTR" target="_blank" class="text-sky-400 hover:text-sky-300 text-2xl">
        <i class='bx bxl-github' ></i>
      </a>
    </div>
  <div>
    <!-- Hidden Lofi Music -->
<iframe 
src="https://www.youtube.com/embed/jfKfPfyJRdk?autoplay=1&mute=0&loop=1&playlist=jfKfPfyJRdk" 
class="w-0 h-0 invisible" 
frameborder="0" 
allow="autoplay"
></iframe>

  </div>

  
  </div>

</body>
</html>
